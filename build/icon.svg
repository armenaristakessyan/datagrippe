<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- DataGrippe app icon: a "DG" monogram on a dark glass panel over a vivid mesh gradient (macOS grid: 824 px tile). -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="95"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#120a2e" flood-opacity="0.35"/>
    </filter>
    <filter id="panel" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0b0420" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="sheen" cx="0.3" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1733"/>
      <stop offset="1" stop-color="#0d0b18"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff2c4" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff6aa9" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="grip" gradientUnits="userSpaceOnUse" x1="610" y1="0" x2="760" y2="0">
      <stop offset="0" stop-color="#14e0a3"/>
      <stop offset="0.55" stop-color="#3b8bff"/>
      <stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#base)"/></g>
  <g clip-path="url(#tile)">
    <g filter="url(#blur)">
      <circle cx="190" cy="210" r="290" fill="#14e0a3"/>
      <circle cx="150" cy="650" r="210" fill="#2f86ff"/>
      <circle cx="900" cy="910" r="320" fill="#ff3d8b"/>
      <circle cx="930" cy="260" r="210" fill="#9b6bff"/>
    </g>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="3"/>
  <!-- dark glass panel -->
  <g filter="url(#panel)"><rect x="232" y="232" width="560" height="560" rx="128" fill="url(#glass)"/></g>
  <rect x="234" y="234" width="556" height="556" rx="126" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- DG: white strokes; the G's bar is the gradient "grip" -->
  <g fill="none" stroke-width="58" stroke-linejoin="round" transform="translate(-21 0)">
    <path d="M330 412 V612 H362 A100 100 0 0 0 362 412 Z" stroke="#fff"/>
    <path d="M678.7 441.3 A100 100 0 1 0 708 512" stroke="#fff" stroke-linecap="butt"/>
    <path d="M737 512 H624" stroke="url(#grip)" stroke-linecap="round"/>
  </g>
</svg>
